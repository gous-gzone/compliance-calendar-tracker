spring:
  application:
    name: compliance-calendar-tracker
  datasource:
    url: jdbc:h2:mem:compliance_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false

server:
  port: 8080

logging:
  level:
    com.example.tool: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
